version: '3.8'

services:
  deepshield-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepshield-experiments
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./experiments:/app/experiments
      - ./research:/app/research
      - ./docs:/app/docs
    # Override with: docker-compose run deepshield-train python experiments/audio/train_and_evaluate.py
    command: python experiments/image/train_and_evaluate.py
